<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U Digital - WiFi Internet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #111827;
        }

        header {
            background: #0b5cff;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        .plans {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 50px 20px;
        }

        .plan {
            background: white;
            width: 300px;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
            transition: 0.3s;
        }

        .plan:hover {
            transform: translateY(-8px);
        }

        .plan h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .speed {
            font-size: 38px;
            font-weight: bold;
            color: #0b5cff;
        }

        .price {
            font-size: 25px;
            margin: 15px 0 25px;
        }

        .button {
            display: inline-block;
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            background: #1ebe5d;
            transform: scale(1.05);
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .contact {
            margin-top: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <header>
        <h1> rail wire WiFi</h1>
        <p>Fast • Reliable • Affordable Internet</p>
    </header>

    <section class="plans">

        <!-- 30 Mbps -->
        <div class="plan">
            <h2>Basic Plan</h2>
            <div class="speed">30 Mbps</div>
            <div class="price">₹400/-</div>

            <a class="button"
               href="https://wa.me/919902166862?text=Hi%2C%20I%20want%20a%20WiFi%20connection."
               target="_blank">
                Get Started
            </a>
        </div>

        <!-- 50 Mbps -->
        <div class="plan">
            <h2>Standard Plan</h2>
            <div class="speed">50 Mbps</div>
            <div class="price">₹600/-</div>

            <a class="button"
               href="https://wa.me/919902166862?text=Hi%2C%20I%20want%20a%20WiFi%20connection."
               target="_blank">
                Get Started
            </a>
        </div>

        <!-- 100 Mbps -->
        <div class="plan">
            <h2>Premium Plan</h2>
            <div class="speed">100 Mbps</div>
            <div class="price">₹800/-</div>

            <a class="button"
               href="https://wa.me/919902166862?text=Hi%2C%20I%20want%20a%20WiFi%20connection."
               target="_blank">
                Get Started
            </a>
        </div>

    </section>

    <footer>
        <h3>Contact Us</h3>
        <div class="contact">WhatsApp: 9902166862</div>
    </footer>

</body>
</html>
